[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mutmut-mcp"
version = "0.1.0"
description = "MCP server for managing mutation testing with mutmut."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
   { name="Will McGinnis", email="will@mcginniscommawill.com" },
]

dependencies = [
    "fastmcp>=3.4.5,<4.0.0",
    "mutmut>=3,<4"
]

[project.optional-dependencies]
dev = [
    # Pinned to match the pre-commit ruff/ruff-format hooks (v0.16.6) so lint
    # results are identical locally, in CI, and in pre-commit.
    "ruff==0.16.6",
    "pytest",
    "pytest-cov",
    "pytest-timeout",
    "mypy",
    "pre-commit",
]

[project.scripts]
mutmut-mcp = "mutmut_mcp:main"

[project.urls]
"Homepage" = "https://github.com/wdm0006/mutmut-mcp"
"Bug Tracker" = "https://github.com/wdm0006/mutmut-mcp/issues"

[tool.mypy]
python_version = "3.10"
check_untyped_defs = true
exclude = ['mutants', '\.venv']

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "W", "F", "I", "C", "B"]
ignore = ["E501", "C901"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]
# 60s per-test guard: several mutants of a subprocess wrapper can plausibly
# hang a test worker. Mutant runs inherit this too — mutmut copies the config
# into its scratch tree — which is exactly where the guard matters most.
# The coverage floor deliberately lives in the CI/Makefile pytest invocation,
# not here, so mutant runs measure test strength rather than the coverage gate.
addopts = "--timeout=60"

[tool.coverage.run]
source = ["mutmut_mcp"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    # The stdio entry-point guard is exercised by launching the server, not by
    # the suite; main() itself is tested with a mocked mcp.run.
    'if __name__ == "__main__":',
]

[tool.mutmut]
# mutmut 3.7.0 form. tests_dir is deprecated (mutmut warns: "add the path to
# pytest_add_cli_args_test_selection instead"), so test selection is passed
# explicitly. The server module is the whole mutation surface; mutmut copies
# it, tests/, and this config into its scratch mutants/ tree on every run.
source_paths = ["mutmut_mcp.py"]
pytest_add_cli_args_test_selection = ["tests"]
# tests/test_mutation_budget.py loads scripts/mutation_budget.py from the repo
# root relative to the test file; the scratch tree does not copy arbitrary
# subdirectories, so scripts/ must be named here for test collection to work.
also_copy = ["scripts"]
