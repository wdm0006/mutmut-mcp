name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv venv .venv
      - run: uv pip install -e ".[dev]"
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy .

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv venv .venv
      - run: uv pip install -e ".[dev]"
      - run: uv run pytest tests/ -v --cov=mutmut_mcp --cov-report=term --cov-fail-under=100

  mutation-budget:
    # The mutation-testing server must mutation-test itself. The campaign runs
    # against mutmut_mcp.py per [tool.mutmut]; the gate scores the result
    # against the waivered survival budget (docs/mutation-waivers.md) and fails
    # the build when the suite's mutation strength regresses.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv venv .venv
      - run: uv pip install -e ".[dev]"
      - name: Run the mutation campaign (survivors are expected; the gate decides)
        run: uv run mutmut run || true
      - name: Enforce the survival budget
        run: uv run python scripts/mutation_budget.py --max-undetected 6
